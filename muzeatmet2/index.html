<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sign Up — Muze at Met 2 | Zing</title>
<meta name="description" content="Sign up for Zing at Muze at Met 2. Your chores, handled." />

<!-- Fonts: Inter (sans) + Cormorant Garamond (serif) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="https://app.justzingit.com/favicon-32x32.png" />
<link rel="apple-touch-icon" href="https://app.justzingit.com/apple-touch-icon.png" />

<style>
  /* ── Design Tokens ── */
  :root {
    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-serif: 'Cormorant Garamond', ui-serif, Georgia, serif;

    --color-background: #f4f2e8;
    --color-main: #33525c;
    --color-secondary: #33525c94;
    --color-accent: #badcc3;
    --color-accent-hover: #a8cfb2;
    --color-accent-faint: #badcc31a;
    --color-border: #33525c1a;
    --color-border-strong: #33525c2e;
    --color-dark: #1e2e32;
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: var(--font-sans);
    color: var(--color-main);
    background-color: var(--color-background);
    max-width: 470px;
    margin: 0 auto;
    min-height: 100dvh;
    overflow-y: auto;
  }

  /* ── Layout ── */
  .page-wrapper {
    display: flex;
    flex-direction: column;
    padding: 1.5rem; /* p-6 */
  }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 1.5rem 0; /* my-6 */
    z-index: 10;
  }

  .header img {
    width: 180px;
    height: auto;
  }

  /* ── Main ── */
  .main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-grow: 1;
  }

  /* ── Title ── */
  .title {
    font-family: var(--font-serif);
    font-size: 1.25rem;    /* text-xl */
    line-height: 1.75rem;
    font-weight: 600;      /* semibold */
    color: var(--color-main);
    margin-bottom: 0.75rem; /* mb-3 */
    margin-top: 1.25rem;    /* mt-5 */
  }

  /* ── Building Badge ── */
  .building-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    background: var(--color-accent-faint);
    border: 1px solid var(--color-border);
    border-radius: 9999px;
    padding: 0.375rem 0.875rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--color-main);
    margin-bottom: 1rem;
  }
  .building-badge svg {
    width: 14px;
    height: 14px;
    opacity: 0.6;
  }

  /* ── Form ── */
  .signup-form {
    width: 100%;
    max-width: 20rem; /* max-w-xs */
  }

  .signup-form > * + * {
    margin-top: 1rem; /* space-y-4 */
  }

  /* ── sr-only ── */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }

  /* ── Inputs ── */
  .form-input {
    width: 100%;
    padding: 0.75rem 1rem; /* px-4 py-3 */
    border: 1px solid #d1d5db; /* gray-300 */
    border-radius: 0.375rem; /* rounded-md */
    font-size: 1rem;
    font-family: var(--font-sans);
    color: var(--color-main);
    background-color: #fff;
    outline: none;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .form-input::placeholder {
    color: #9ca3af; /* gray-400 */
  }

  .form-input:focus {
    box-shadow: 0 0 0 2px var(--color-accent);
    border-color: transparent;
  }

  /* ── Password wrapper ── */
  .password-wrapper {
    position: relative;
  }

  .password-wrapper .form-input {
    padding-right: 2.5rem;
  }

  .toggle-password {
    position: absolute;
    inset: 0 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 0.75rem;
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    transition: color 0.15s;
  }
  .toggle-password:hover {
    color: #374151;
  }

  /* ── Pets label ── */
  .pets-label {
    display: block;
    font-size: 0.875rem; /* text-sm */
    font-weight: 500;
    color: #9ca3af; /* gray-400 */
    margin-bottom: 0.25rem;
  }

  /* ── SMS Consent ── */
  .consent-box {
    border-radius: 0.5rem;
    padding: 1rem;
  }

  .consent-label {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    cursor: pointer;
  }

  .consent-checkbox {
    margin-top: 0.25rem;
    width: 1rem;
    height: 1rem;
    border-radius: 0.25rem;
    border: 1px solid #d1d5db;
    accent-color: var(--color-accent);
    flex-shrink: 0;
  }

  .consent-text {
    font-size: 0.75rem; /* text-xs */
    color: #6b7280; /* gray-500 */
    line-height: 1.625; /* leading-relaxed */
  }

  /* ── Submit Button ── */
  .submit-section {
    padding-top: 1rem;
  }

  .submit-btn {
    width: 100%;
    background-color: var(--color-accent);
    color: #1f2937; /* gray-800 */
    font-weight: 600;
    padding: 0.75rem 0;
    border-radius: 9999px;
    border: none;
    font-size: 1rem;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .submit-btn:hover {
    background-color: var(--color-accent-hover);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ── Links ── */
  .privacy-link {
    text-align: center;
    padding-top: 0.5rem;
  }

  .privacy-link a {
    font-size: 0.875rem;
    color: #6b7280;
    text-decoration: underline;
    transition: color 0.15s;
  }
  .privacy-link a:hover {
    color: #374151;
  }

  .login-link {
    color: var(--color-main);
    font-size: 1.25rem;
    text-decoration: none;
    margin-top: 1.25rem;
    transition: text-decoration 0.15s;
  }
  .login-link:hover {
    text-decoration: underline;
  }

  /* ── Powered by ── */
  .powered-by {
    text-align: center;
    margin-top: 2rem;
    padding-bottom: 1.5rem;
    font-size: 0.75rem;
    color: var(--color-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
  }
  .powered-by a {
    color: var(--color-main);
    text-decoration: none;
    font-weight: 600;
  }
  .powered-by a:hover {
    text-decoration: underline;
  }

  /* ── Error message ── */
  .error-message {
    background-color: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 0.375rem;
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    display: none;
  }

  /* ── Success redirect overlay ── */
  .redirect-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--color-background);
    z-index: 50;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 1rem;
  }
  .redirect-overlay.show {
    display: flex;
  }
  .redirect-overlay .spinner {
    width: 2rem;
    height: 2rem;
    border: 3px solid var(--color-border);
    border-top-color: var(--color-accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>

<body>
<div class="page-wrapper">
  <!-- Header: Muze at Met logo -->
  <header class="header">
    <img src="muze-logo.png" alt="Muze at Met 2" />
  </header>

  <main class="main-content">
    <h1 class="title">Enter your information below:</h1>

    <!-- Building indicator -->
    <div class="building-badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V9"/><path d="M15 21V9"/><path d="M9 9h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
      Muze at Met 2
    </div>

    <!-- Error message -->
    <div class="error-message" id="errorMessage"></div>

    <form class="signup-form" id="signupForm" novalidate>
      <!-- Hidden building field -->
      <input type="hidden" name="buildingId" value="muzeatmet2" />

      <div>
        <label for="fullName" class="sr-only">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Full Name*" required class="form-input" />
      </div>

      <div>
        <label for="email" class="sr-only">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Email Address*" required class="form-input" />
      </div>

      <div>
        <label for="phone" class="sr-only">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number*" required class="form-input" />
      </div>

      <div>
        <label for="aptNumber" class="sr-only">Apt. Number</label>
        <input type="text" id="aptNumber" name="aptNumber" placeholder="Apt. Number*" required class="form-input" />
      </div>

      <div class="password-wrapper">
        <label for="password" class="sr-only">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" required class="form-input" />
        <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePassword()">
          <!-- Eye icon -->
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <!-- Eye-off icon (hidden initially) -->
          <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
            <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.749 10.749 0 0 1 4.446-5.143"></path>
            <path d="m2 2 20 20"></path>
          </svg>
        </button>
      </div>

      <div>
        <label for="petsInfo" class="pets-label">Do you have any pets? Let us know below:</label>
        <input type="text" id="petsInfo" name="petsInfo" placeholder="yes, we have a german shepard" class="form-input" />
      </div>

      <div class="consent-box">
        <label class="consent-label">
          <input type="checkbox" id="smsConsent" name="smsConsent" class="consent-checkbox" />
          <span class="consent-text">By checking this box, you agree to receive SMS messages from JustZingIt related to cleaning services, including account verification, booking updates, and service notifications. Message frequency varies. Message and data rates may apply. Reply STOP to cancel or HELP for assistance. SMS notifications are required for service-related updates.</span>
        </label>
      </div>

      <div class="submit-section">
        <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
      </div>

      <div class="privacy-link">
        <a href="https://www.justzingit.com/privacy" target="_blank" rel="noopener noreferrer">Terms of Service &amp; Privacy Policy</a>
      </div>
    </form>

    <a class="login-link" href="https://app.justzingit.com/login">Already have an account? Log in</a>
  </main>

  <!-- Powered by Zing -->
  <div class="powered-by">
    Powered by <a href="https://www.justzingit.com" target="_blank" rel="noopener noreferrer">Zing</a>
  </div>
</div>

<!-- Redirect overlay -->
<div class="redirect-overlay" id="redirectOverlay">
  <div class="spinner"></div>
  <p style="color: var(--color-main); font-weight: 500;">Setting up your account…</p>
</div>

<script>
  // Toggle password visibility
  function togglePassword() {
    const input = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const btn = document.querySelector('.toggle-password');

    if (input.type === 'password') {
      input.type = 'text';
      eyeIcon.style.display = 'none';
      eyeOffIcon.style.display = 'block';
      btn.setAttribute('aria-label', 'Hide password');
    } else {
      input.type = 'password';
      eyeIcon.style.display = 'block';
      eyeOffIcon.style.display = 'none';
      btn.setAttribute('aria-label', 'Show password');
    }
  }

  // Form submission
  document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorEl = document.getElementById('errorMessage');
    errorEl.style.display = 'none';

    const form = e.target;
    const data = {
      fullName:    form.fullName.value.trim(),
      email:       form.email.value.trim(),
      phone:       form.phone.value.trim(),
      aptNumber:   form.aptNumber.value.trim(),
      password:    form.password.value,
      petsInfo:    form.petsInfo.value.trim(),
      buildingId:  form.buildingId.value,
      smsConsent:  form.smsConsent.checked
    };

    // Basic validation
    if (!data.fullName || !data.email || !data.phone || !data.aptNumber || !data.password) {
      errorEl.textContent = 'Please fill in all required fields.';
      errorEl.style.display = 'block';
      return;
    }

    // Email format check
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      errorEl.textContent = 'Please enter a valid email address.';
      errorEl.style.display = 'block';
      return;
    }

    // Show redirect overlay & redirect to the real signup with pre-filled query params
    document.getElementById('redirectOverlay').classList.add('show');

    const params = new URLSearchParams({
      building: data.buildingId,
      name:     data.fullName,
      email:    data.email,
      phone:    data.phone,
      apt:      data.aptNumber,
    });

    // Small delay so user sees the transition
    setTimeout(function() {
      window.location.href = 'https://app.justzingit.com/signup?' + params.toString();
    }, 600);
  });
</script>
</body>
</html>
