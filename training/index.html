<!-- @dsCard group="Resident App" viewport="480x860" name="Cleaner Training — Daily Lesson" subtitle="Duolingo-style daily micro-lessons from the Manual de Limpieza (ES/EN)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zing · Entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F3EA;--paper2:#EFE9DC;--card:#FFFDF8;--line:#E3DCCB;--forest:#1F3A34;--forest2:#2C4A42;--sage:#5F7A63;--sage-soft:#DFE8DC;--sage-100:#EDF2EA;--ink:#242B28;--ink-soft:#5C665F;--ink-mute:#8C948D;--gold:#C99B4A;--red:#B2542F;--red-soft:#F4E1D7;--green-ok:#3E7A4E;--r-lg:20px;--r-md:14px;--r-pill:999px;--sans:'Hanken Grotesk',sans-serif;--serif:'Newsreader',serif;--shadow-md:0 6px 20px rgba(31,42,36,.09);--shadow-lg:0 14px 40px rgba(31,42,36,.16)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper2);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--sage)}a:hover{color:var(--forest)}
#root{height:100%}
.shell{height:100%;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:440px;height:100%;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){.shell{align-items:center;padding:24px 0}.app{height:min(860px,calc(100% - 48px));border-radius:34px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}}
button{font-family:var(--sans);cursor:pointer;border:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:var(--r-pill);font-size:16px;font-weight:700;transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:scale(.97)}
.btn--primary{background:var(--forest);color:#F7F3EA;box-shadow:0 4px 14px rgba(31,58,52,.28)}
.btn--primary:disabled{background:var(--line);color:var(--ink-mute);box-shadow:none;cursor:not-allowed}
.btn--ghost{background:transparent;color:var(--forest);border:1.5px solid var(--line)}
.lang{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:40;display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;box-shadow:var(--shadow-md)}
.lang button{padding:5px 11px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:transparent;color:var(--ink-mute)}
.lang button.on{background:var(--forest);color:#F7F3EA}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:sIn .42s cubic-bezier(.22,.9,.3,1) both}
.screen--back{animation:sBk .42s cubic-bezier(.22,.9,.3,1) both}
@keyframes sIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes sBk{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.34,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* welcome */
.wel{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 26px calc(28px + env(safe-area-inset-bottom))}
.wel__logo{height:30px;width:auto;align-self:flex-start;margin-bottom:26px}
.wel h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.12;letter-spacing:-.02em;color:var(--forest);text-wrap:balance}
.wel__sub{color:var(--ink-soft);font-size:14.5px;margin-top:10px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:26px}
.name{padding:17px 12px;border-radius:var(--r-md);background:var(--card);border:1.5px solid var(--line);font-size:16px;font-weight:600;color:var(--forest);transition:all .15s ease;animation:rise .5s cubic-bezier(.22,.9,.3,1) both}
.name:hover{border-color:var(--sage);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.name:active{transform:scale(.96)}
/* splash */
.splash{position:absolute;inset:0;z-index:60;background:var(--forest);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F7F3EA;text-align:center;padding:30px;animation:splashIn .45s ease both}
.splash--out{animation:splashOut .5s ease both}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes splashOut{from{opacity:1}to{opacity:0;visibility:hidden}}
.splash h2{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.02em;line-height:1.1;animation:pop .6s .1s cubic-bezier(.34,1.5,.5,1) both}
.splash .flame{font-size:44px;margin-top:22px;animation:pop .6s .35s cubic-bezier(.34,1.5,.5,1) both}
.splash .streakN{font-size:17px;font-weight:700;margin-top:8px;color:#DFE8DC;animation:rise .5s .5s both}
/* home */
.home{flex:1;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.home::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.top img{height:24px}
.hello{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:16px}
.streakchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--forest);margin-top:8px;box-shadow:var(--shadow-md)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.datebar h2{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--forest);letter-spacing:-.01em;text-transform:capitalize}
.datebar .sub{font-size:12.5px;font-weight:600;color:var(--ink-mute);margin-top:3px}
.arrows{display:flex;gap:8px}
.arrow{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--forest);display:grid;place-items:center;font-size:17px;transition:all .15s}
.arrow:hover:not(:disabled){background:var(--sage-soft)}
.arrow:disabled{opacity:.3;cursor:not-allowed}
.lcard{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.lcard__tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sage)}
.lcard__done{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--green-ok);color:#fff;display:grid;place-items:center;font-size:14px}
.lcard__icon{width:96px;height:96px;object-fit:contain;display:block;margin:14px auto 6px;filter:drop-shadow(0 8px 14px rgba(31,42,36,.14));animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.lcard h3{font-family:var(--serif);font-weight:500;font-size:23px;color:var(--forest);text-align:center;letter-spacing:-.01em;text-wrap:balance}
.lcard__meta{display:flex;justify-content:center;gap:14px;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--ink-mute)}
.lcard .btn{margin-top:18px}
.days{display:flex;gap:7px;margin-top:22px;justify-content:center}
.dayp{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink-mute);transition:all .2s}
.dayp--done{background:var(--green-ok);border-color:var(--green-ok);color:#fff}
.dayp--today{border-color:var(--forest);color:var(--forest);box-shadow:0 0 0 3px var(--sage-soft)}
.progresslbl{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-mute);margin-top:9px}
.switch{margin-top:auto;padding-top:20px;text-align:center}
.switch button{background:none;font-size:12.5px;font-weight:600;color:var(--ink-mute);text-decoration:underline}
/* lesson */
.les{flex:1;display:flex;flex-direction:column;min-height:0}
.les__hd{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px}
.les__hd .arrow{width:36px;height:36px;flex-shrink:0}
.pbar{flex:1;height:8px;border-radius:4px;background:var(--paper2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--sage);transition:width .5s cubic-bezier(.22,.9,.3,1)}
.les__body{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 20px}
.les__body::-webkit-scrollbar{display:none}
.les__foot{padding:14px 22px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.figure{background:linear-gradient(150deg,var(--sage-100),var(--sage-soft));border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:grid;place-items:center;margin:8px 0 18px}
.figure img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(31,42,36,.16))}
.les h2{font-family:var(--serif);font-weight:500;font-size:26px;color:var(--forest);letter-spacing:-.015em;line-height:1.12;text-wrap:balance}
.sec{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin:22px 0 9px}
.les p{font-size:15px;line-height:1.6;color:var(--ink-soft);text-wrap:pretty}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:none}
.step__n{width:26px;height:26px;border-radius:50%;background:var(--forest);color:#F7F3EA;font-size:12.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.step span{font-size:14.5px;line-height:1.45;color:var(--ink);padding-top:3px}
.tipbox{background:var(--red-soft);border:1px solid #E5C4B2;border-radius:var(--r-md);padding:14px 16px;font-size:13.5px;line-height:1.5;color:#7A3B20;margin-top:4px}
.tipbox b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
/* quiz */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:15px;font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:10px;transition:all .15s}
.opt:hover{border-color:var(--sage)}
.opt__k{width:26px;height:26px;border-radius:8px;background:var(--paper2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-mute);flex-shrink:0}
.opt--sel{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest);background:var(--sage-100)}
.opt--right{border-color:var(--green-ok);background:#E4EFE4;box-shadow:inset 0 0 0 1px var(--green-ok);animation:okBounce .5s cubic-bezier(.34,1.5,.5,1)}
.opt--wrong{border-color:var(--red);background:var(--red-soft);animation:shake .4s ease}
@keyframes okBounce{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.verdict{border-radius:var(--r-md);padding:14px 16px;margin-top:6px;font-size:13.5px;line-height:1.5;animation:rise .4s both}
.verdict--ok{background:#E4EFE4;color:#28522F}
.verdict--no{background:var(--red-soft);color:#7A3B20}
.verdict b{display:block;font-size:14.5px;margin-bottom:4px}
/* done */
.fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.fin__ringwrap{position:relative;display:grid;place-items:center}
.fin__ring{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid var(--sage);animation:ringOut 1.6s ease-out infinite}
@keyframes ringOut{from{transform:scale(1);opacity:.6}to{transform:scale(1.8);opacity:0}}
.fin__badge{width:110px;height:110px;border-radius:50%;background:var(--sage-soft);display:grid;place-items:center;font-size:48px;animation:pop .6s cubic-bezier(.34,1.5,.5,1) both}
.fin h2{font-family:var(--serif);font-weight:500;font-size:29px;color:var(--forest);margin-top:26px;letter-spacing:-.02em}
.fin p{font-size:14.5px;color:var(--ink-soft);margin-top:10px;max-width:280px}
.fin .streakchip{margin-top:18px;font-size:15px;padding:10px 18px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:13px;border-radius:2px;animation:fall 2.6s linear both}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(110vh) rotate(560deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lessons.js"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
